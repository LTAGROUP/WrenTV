name: WrenTV
options:
  bundleIdPrefix: com.wrentv
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.6.2"
    CURRENT_PROJECT_VERSION: "9"
targets:
  WrenTV:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: Sparkle
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: Wren TV
        CFBundleDisplayName: Wren TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Wren TV connects to media servers on your network.
        # Sparkle: checks for a new version at launch and daily after.
        SUFeedURL: https://github.com/LTAGROUP/WrenTV/releases/latest/download/appcast.xml
        SUPublicEDKey: 9TJT5UW+Hn/922dFPo4MFLl04w+yN6VREMaK7ICscLo=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
    settings:
      base:
        PRODUCT_NAME: Wren TV
        PRODUCT_MODULE_NAME: WrenTV
        PRODUCT_BUNDLE_IDENTIFIER: com.wrentv.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Player/MPV-Bridging-Header.h
        HEADER_SEARCH_PATHS: /opt/homebrew/include
        LIBRARY_SEARCH_PATHS: /opt/homebrew/lib
        OTHER_LDFLAGS: -lmpv
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks /opt/homebrew/lib"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        GCC_PREPROCESSOR_DEFINITIONS: "GL_SILENCE_DEPRECATION=1 $(inherited)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GL_SILENCE_DEPRECATION"
