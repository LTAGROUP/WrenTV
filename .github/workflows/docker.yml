# Builds the server image on every push to main and publishes it to
# ghcr.io/ltagroup/wrentv (:latest and :<short sha>). Servers update with
#   docker compose pull && docker compose up -d
# Pushes that only touch the client apps (apps/) are skipped.
name: Docker image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Short commit
        id: v
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.v.outputs.sha }}
          tags: |
            ghcr.io/ltagroup/wrentv:latest
            ghcr.io/ltagroup/wrentv:${{ steps.v.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
