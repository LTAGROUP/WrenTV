# Builds Wren TV for Windows (WinUI 3 + libmpv) and its installer,
# WrenTV-Windows-Setup.exe. Every push that touches apps/windows uploads the
# installer as a workflow artifact; a published release (or a manual run
# naming a release tag) also gets it attached as a release asset, which is
# where the app's update check looks.
name: Windows app

on:
  push:
    branches: [main]
    paths:
      - 'apps/windows/**'
      - '.github/workflows/windows.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the installer to this release (e.g. v0.1.3); leave empty to only build'
        required: false

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}-${{ github.event.inputs.release_tag || github.event.release.tag_name || 'build' }}
  cancel-in-progress: true

env:
  # libmpv from shinchiro/mpv-winbuild-cmake, pinned by name and checksum.
  # Those releases are pruned over time: bump both together when it 404s.
  MPV_TAG: '20261007'
  MPV_ASSET: 'mpv-dev-x86_64-20261007-git-eb0ee10315.7z'
  MPV_SHA256: '3fd93055d437310ad094d3f80c9b04f9a56e8b138bcb7d9c5cf01870abbfe5a5'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: v
        run: |
          $tag = '${{ github.event.inputs.release_tag || github.event.release.tag_name }}'
          if ($tag) { $version = $tag.TrimStart('v') }
          else { $version = ([xml](Get-Content WrenTV/WrenTV.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version"

      - name: Fetch libmpv
        run: |
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$env:MPV_TAG/$env:MPV_ASSET"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\mpv" | Out-Null
          $archive = "$env:RUNNER_TEMP\mpv\mpv-dev.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MPV_SHA256) { throw "libmpv checksum mismatch: $hash" }
          7z x $archive -o"$env:RUNNER_TEMP\mpv\out" -y | Out-Null
          New-Item -ItemType Directory -Force -Path WrenTV/lib/x64 | Out-Null
          Copy-Item "$env:RUNNER_TEMP\mpv\out\libmpv-2.dll" WrenTV/lib/x64/
          Get-Item WrenTV/lib/x64/libmpv-2.dll | Format-List Name, Length

      # Visual Studio's MSBuild, not `dotnet publish`: the Windows App SDK's
      # resource (PRI) tasks ship with Visual Studio, not the .NET SDK.
      - uses: microsoft/setup-msbuild@v2

      - name: Publish
        run: >
          msbuild WrenTV/WrenTV.csproj -restore -t:Publish -v:m -nologo
          -p:Configuration=Release -p:RuntimeIdentifier=win-x64 -p:Platform=x64
          -p:Version=${{ steps.v.outputs.version }} -p:PublishDir=$PWD\dist\app\

      - name: Check output
        run: |
          foreach ($f in 'WrenTV.exe', 'libmpv-2.dll', 'resources.pri', 'Assets\lockup.png', 'Assets\WrenTV.ico') {
            if (-not (Test-Path "dist/app/$f")) { throw "missing $f in the published app" }
          }

      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /DAppVersion=${{ steps.v.outputs.version }} /DSourceDir=..\dist\app /DOutputDir=..\dist installer\WrenTV.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-Item dist/WrenTV-Windows-Setup.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: WrenTV-Windows-Setup
          path: apps/windows/dist/WrenTV-Windows-Setup.exe

      - name: Attach to release
        if: steps.v.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.v.outputs.tag }}" dist/WrenTV-Windows-Setup.exe --clobber --repo "${{ github.repository }}"
